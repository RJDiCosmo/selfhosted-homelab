# Frontend sends its JWT as X-Auth-Token (see patch-auth-header.py) so the browser's
# Basic Auth header stays intact for the reverse proxy; hand the backend a normal Bearer header.
# Requests with no X-Auth-Token (e.g. music-api's direct calls) pass Authorization through.
map $http_x_auth_token $studio_auth {
    default "Bearer $http_x_auth_token";
    ""      $http_authorization;
}

server {
    listen 3000;
    root /app/dist;
    client_max_body_size 1g;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    location ~ ^/(api|audio|editor|demucs-web|blog)(/|$) {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header Authorization $studio_auth;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
    location / {
        try_files $uri /index.html;
    }
}
